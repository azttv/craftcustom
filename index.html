<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Craft Custom Maker</title>
<style>
body { font-family: monospace; margin: 16px; background: #fff; color: #111; }
h1 { font-size: 18px; margin: 0 0 4px; }
p.sub { margin: 0 0 16px; color: #555; font-size: 12px; }
#wrap { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
#left { flex: 0 0 auto; }
#right { flex: 1 1 420px; min-width: 360px; }
#tpl { position: relative; width: 799px; max-width: 100%; border: 1px solid #ccc; }
#tpl img.bg { width: 100%; display: block; }
.slot { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center; }
.slot.over { outline: 2px solid #000; }
.slot img, .slot canvas { width: 86%; height: 86%; image-rendering: pixelated; }
button { font-family: monospace; font-size: 13px; padding: 5px 10px; cursor: pointer; }
#dl { margin-top: 10px; }
#tabs { margin-bottom: 8px; }
#tabs button.on { font-weight: bold; text-decoration: underline; }
.note { font-size: 11px; color: #666; margin: 6px 0; }
#search { font-family: monospace; width: 200px; padding: 4px; margin-bottom: 8px; }
.list { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; max-height: 620px; overflow-y: auto; border: 1px solid #ccc; padding: 4px; }
.cell { position: relative; aspect-ratio: 1/1; border: 1px solid #eee; cursor: grab; }
.cell img, .cell canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
.cell.sel { border-color: #000; background: #ddd; }
.cell .x { display: none; position: absolute; top: 0; right: 0; background: #fff; border: 1px solid #000; font-size: 10px; line-height: 10px; padding: 0 2px; cursor: pointer; }
.cell:hover .x { display: block; }
#count { font-size: 11px; color: #666; }
#tip { position: fixed; display: none; background: #100010; color: #fff; border: 2px solid #2b0b5e; padding: 2px 6px; font-size: 12px; pointer-events: none; z-index: 9; }
</style>
</head>

  d.style.top = (s[1] / H * 100) + "%";
  d.style.width = (s[2] / W * 100) + "%";
  d.style.height = (s[3] / H * 100) + "%";
  d.addEventListener("dragover", function (e) { e.preventDefault(); d.classList.add("over"); });
  d.addEventListener("dragleave", function () { d.classList.remove("over"); });
  d.addEventListener("drop", function (e) {
    e.preventDefault(); d.classList.remove("over");
    var raw = e.dataTransfer.getData("text/plain");
    if (raw) setSlot(i, JSON.parse(raw));
  });
  d.addEventListener("click", function () { if (selected) setSlot(i, selected); });
  d.addEventListener("contextmenu", function (e) { e.preventDefault(); setSlot(i, null); });
  tpl.appendChild(d);
});
function setSlot(i, d) {
  var el = tpl.querySelector('.slot[data-i="' + i + '"]');
  el.innerHTML = "";
  if (!d) { delete placed[i]; el.title = ""; return; }
  placed[i] = d;
  el.title = d.k === "c" ? d.n : pretty(d.n);
  var c = document.createElement("canvas");
  el.appendChild(c);
  renderTo(c, d, 192);
}

// ---------- palette ----------
var tip = document.getElementById("tip");
var obs = new IntersectionObserver(function (es) {
  es.forEach(function (e) {
    if (!e.isIntersecting) return;
    obs.unobserve(e.target);
    renderTo(e.target, JSON.parse(e.target.dataset.d), 64);
  });
});

function cell(label, d, removable, idx) {
  var c = document.createElement("div");
  c.className = "cell"; c.draggable = true;
  var node = document.createElement("canvas");
  node.width = 64; node.height = 64;
  node.dataset.d = JSON.stringify(d);
  obs.observe(node);
  c.appendChild(node);
  c.addEventListener("mouseenter", function () { tip.textContent = label; tip.style.display = "block"; });
  c.addEventListener("mousemove", function (e) {
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top = (e.clientY + 14) + "px";
  });
  c.addEventListener("mouseleave", function () { tip.style.display = "none"; });
  c.addEventListener("dragstart", function (e) { tip.style.display = "none"; e.dataTransfer.setData("text/plain", JSON.stringify(d)); });
  c.addEventListener("click", function () {
    var p = document.querySelector(".cell.sel");
    if (p) p.classList.remove("sel");
    if (selected && JSON.stringify(selected) === JSON.stringify(d)) selected = null;
    else { selected = d; c.classList.add("sel"); }
  });
  if (removable) {
    var x = document.createElement("span");
    x.className = "x"; x.textContent = "X";
    x.addEventListener("click", function (e) { e.stopPropagation(); customs.splice(idx, 1); renderCustom(); });
    c.appendChild(x);
  }
  return c;
}

var NAMES = Object.keys(DATA);
var listMc = document.getElementById("listMc");
function renderMc() {
  var f = document.getElementById("search").value.toLowerCase().replace(/ /g, "_");
  listMc.innerHTML = "";
  var frag = document.createDocumentFragment(), n = 0;
  NAMES.forEach(function (name) {
    if (f && name.indexOf(f) === -1) return;
    frag.appendChild(cell(pretty(name), { k: "v", n: name }, false)); n++;
  });
  listMc.appendChild(frag);
  document.getElementById("count").textContent = " " + n + " items";
}
renderMc();

var listCustom = document.getElementById("listCustom");
function renderCustom() {
  listCustom.innerHTML = "";
  customs.forEach(function (o, i) { listCustom.appendChild(cell(o.name, { k: "c", n: o.name, src: o.src }, true, i)); });
}

document.getElementById("search").addEventListener("input", renderMc);
document.querySelectorAll("#tabs button").forEach(function (b) {
  b.addEventListener("click", function () {
    document.querySelectorAll("#tabs button").forEach(function (o) { o.classList.remove("on"); });
    b.classList.add("on");
    var mc = b.dataset.tab === "mc";
    listMc.style.display = mc ? "grid" : "none";
    listCustom.style.display = mc ? "none" : "grid";
    document.getElementById("search").style.display = mc ? "" : "none";
    document.getElementById("count").style.display = mc ? "" : "none";
  });
});

// ---------- import ----------
var fileInput = document.getElementById("file");
document.getElementById("add").addEventListener("click", function () { fileInput.click(); });
fileInput.addEventListener("change", function (e) {
  Array.prototype.forEach.call(e.target.files, importFile);
  fileInput.value = "";
});
function importFile(f) {
  var r = new FileReader();
  r.onload = function () {
    var im = new Image();
    im.onload = function () {
      if (im.width !== im.height) { alert(f.name + " : image non 1:1 (" + im.width + "x" + im.height + ")"); return; }
      var cv = document.createElement("canvas");
      cv.width = 128; cv.height = 128;
      var cx = cv.getContext("2d");
      cx.imageSmoothingEnabled = false;
      cx.drawImage(im, 0, 0, 128, 128);
      customs.push({ name: f.name, src: cv.toDataURL("image/png") });
      renderCustom();
    };
    im.src = r.result;
  };
  r.readAsDataURL(f);
}

// ---------- export ----------
document.getElementById("dl").addEventListener("click", function () {
  var cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  var cx = cv.getContext("2d");
  cx.imageSmoothingEnabled = false;
  load(document.querySelector("#tpl img.bg").src).then(function (bg) {
    cx.drawImage(bg, 0, 0, W, H);
    return Promise.all(Object.keys(placed).map(function (i) {
      var d = placed[i], s = SLOTS[i];
      var sz = Math.round(s[2] * 0.86), off = Math.round((s[2] - sz) / 2);
      if (d.k === "c") {
        return load(d.src).then(function (im) {
          cx.imageSmoothingEnabled = false;
          cx.drawImage(im, s[0] + off, s[1] + off, sz, sz);
        });
      }
      var e = DATA[d.n];
      return preload(e).then(function (imgs) { draw(cx, e, imgs, s[0] + off, s[1] + off, sz); });
    }));
  }).then(function () {
    var a = document.createElement("a");
    a.download = "craft.png";
    a.href = cv.toDataURL("image/png");
    a.click();
  }).catch(function (e) { alert("Erreur export : " + e); });
});

document.getElementById("clear").addEventListener("click", function () {
  SLOTS.forEach(function (_, i) { setSlot(i, null); });
});
</script>
</body>
