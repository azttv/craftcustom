<style>
body { font-family: monospace; margin: 16px; background: #fff; color: #111; }
h1 { font-size: 18px; margin: 0 0 4px; }

#wrap { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
#left { flex: 0 0 auto; }
#right { flex: 1 1 420px; min-width: 360px; }
#tpl { position: relative; width: 799px; max-width: 100%; border: 1px solid #ccc; }
#tpl img.bg { width: 100%; display: block; }
.slot { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center; }
.slot.over { outline: 2px solid #000; }
.slot img, .slot canvas { width: 82%; height: 82%; image-rendering: pixelated; }
button { font-family: monospace; font-size: 13px; padding: 5px 10px; cursor: pointer; }
#dl { margin-top: 10px; }
#tabs { margin-bottom: 8px; }
#tabs button.on { font-weight: bold; text-decoration: underline; }
.note { font-size: 11px; color: #666; margin: 6px 0; }
#search { font-family: monospace; width: 200px; padding: 4px; margin-bottom: 8px; }
.list { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; max-height: 620px; overflow-y: auto; border: 1px solid #ccc; padding: 4px; }
.cell { position: relative; aspect-ratio: 1/1; border: 1px solid #eee; cursor: grab; }
.cell img, .cell canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
.cell.sel { border-color: #000; background: #ddd; }
.cell .x { display: none; position: absolute; top: 0; right: 0; background: #fff; border: 1px solid #000; font-size: 10px; line-height: 10px; padding: 0 2px; cursor: pointer; }
.cell:hover .x { display: block; }
#count { font-size: 11px; color: #666; }
label { font-size: 12px; }
</style>

var SLOTS = [[31,31,99,99],[143,31,99,99],[254,31,99,99],[31,143,99,99],[143,143,99,99],[254,143,99,99],[31,254,99,99],[143,254,99,99],[254,254,99,99],[638,124,136,136]];
var W = 799, H = 384;

var TINT = {
  grass_block_top: "#91BD59", grass_block_side_overlay: "#91BD59", short_grass: "#91BD59",
  tall_grass_top: "#91BD59", tall_grass_bottom: "#91BD59", fern: "#91BD59",
  large_fern_top: "#91BD59", large_fern_bottom: "#91BD59", sugar_cane: "#91BD59",
  vine: "#48B518", lily_pad: "#208030", spruce_leaves: "#619961", birch_leaves: "#80A755",
  attached_melon_stem: "#91BD59", attached_pumpkin_stem: "#91BD59"
};
function tintOf(n) {
  if (TINT[n]) return TINT[n];
  if (/_leaves$/.test(n) && !/cherry|azalea/.test(n)) return "#48B518";
  return null;
}

var placed = {};
var customs = [];
var selected = null;
var iso = document.getElementById("iso");

var cache = {};
function load(src, tint) {
  var k = src + "|" + (tint || "");
  if (cache[k]) return cache[k];
  cache[k] = new Promise(function (res, rej) {
    var im = new Image();
    if (src.indexOf("data:") !== 0) im.crossOrigin = "anonymous";
    im.onload = function () { res(tint ? applyTint(im, tint) : im); };
    im.onerror = function () { rej(new Error("load " + src)); };
    im.src = src;
  });
  return cache[k];
}
function applyTint(im, color) {
  var c = document.createElement("canvas");
  c.width = im.width; c.height = im.height;
  var x = c.getContext("2d");
  x.imageSmoothingEnabled = false;
  x.drawImage(im, 0, 0);
  x.globalCompositeOperation = "multiply";
  x.fillStyle = color;
  x.fillRect(0, 0, c.width, c.height);
  x.globalCompositeOperation = "destination-in";
  x.drawImage(im, 0, 0);
  return c;
}
function texUrl(kind, n) { return BASE + kind + "/" + n + ".png"; }

function drawCube(cx, imgs, x, y, w) {
  var q = [
    { i: imgs[0], o: [0, w / 4], u: [w / 2, -w / 4], v: [w / 2, w / 4], p: [[0, w / 4], [w / 2, 0], [w, w / 4], [w / 2, w / 2]], s: 0 },
    { i: imgs[1], o: [0, w / 4], u: [w / 2, w / 4], v: [0, w / 2], p: [[0, w / 4], [w / 2, w / 2], [w / 2, w], [0, 3 * w / 4]], s: 0.2 },
    { i: imgs[2], o: [w / 2, w / 2], u: [w / 2, -w / 4], v: [0, w / 2], p: [[w / 2, w / 2], [w, w / 4], [w, 3 * w / 4], [w / 2, w]], s: 0.38 }
  ];
  q.forEach(function (f) {
    cx.save();
    cx.beginPath();
    f.p.forEach(function (p, i) {
      var px = x + w / 2 + (p[0] - w / 2) * 1.012, py = y + w / 2 + (p[1] - w / 2) * 1.012;
      i ? cx.lineTo(px, py) : cx.moveTo(px, py);
    });
    cx.closePath();
    cx.clip();
    cx.save();
    var tw = f.i.width, th = f.i.height;
    cx.transform(f.u[0] / tw, f.u[1] / tw, f.v[0] / th, f.v[1] / th, x + f.o[0], y + f.o[1]);
    cx.imageSmoothingEnabled = false;
    cx.drawImage(f.i, 0, 0);
    cx.restore();
    if (f.s) { cx.fillStyle = "rgba(0,0,0," + f.s + ")"; cx.fillRect(x - 2, y - 2, w + 4, w + 4); }
    cx.restore();
  });
}
function cubeImgs(faces) {
  return Promise.all(faces.map(function (n) { return load(texUrl("block", n), tintOf(n)); }));
}
function renderCubeTo(canvas, faces, size) {
  canvas.width = size; canvas.height = size;
  return cubeImgs(faces).then(function (imgs) {
    var cx = canvas.getContext("2d");
    cx.clearRect(0, 0, size, size);
    drawCube(cx, imgs, 0, 0, size);
  }).catch(function () {});
}

function descNode(d, size) {
  if (d.t === "cube" && iso.checked) {
    var c = document.createElement("canvas");
    renderCubeTo(c, d.f, size);
    return c;
  }
  var im = document.createElement("img");
  im.src = d.t === "cube" ? texUrl("block", d.f[1]) : d.src;
  im.draggable = false;
  return im;
}

var tpl = document.getElementById("tpl");
SLOTS.forEach(function (s, i) {
  var d = document.createElement("div");
  d.className = "slot"; d.dataset.i = i;
  d.style.left = (s[0] / W * 100) + "%";
  d.style.top = (s[1] / H * 100) + "%";
  d.style.width = (s[2] / W * 100) + "%";
  d.style.height = (s[3] / H * 100) + "%";
  d.addEventListener("dragover", function (e) { e.preventDefault(); d.classList.add("over"); });
  d.addEventListener("dragleave", function () { d.classList.remove("over"); });
  d.addEventListener("drop", function (e) {
    e.preventDefault(); d.classList.remove("over");
    var raw = e.dataTransfer.getData("text/plain");
    if (raw) setSlot(i, JSON.parse(raw));
  });
  d.addEventListener("click", function () { if (selected) setSlot(i, selected); });
  d.addEventListener("contextmenu", function (e) { e.preventDefault(); setSlot(i, null); });
  tpl.appendChild(d);
});
function setSlot(i, d) {
  var el = tpl.querySelector('.slot[data-i="' + i + '"]');
  el.innerHTML = "";
  if (d) { placed[i] = d; el.appendChild(descNode(d, 160)); }
  else { delete placed[i]; }
}
function refreshSlots() { Object.keys(placed).forEach(function (i) { setSlot(i, placed[i]); }); }

var obs = new IntersectionObserver(function (es) {
  es.forEach(function (e) {
    if (!e.isIntersecting) return;
    obs.unobserve(e.target);
    renderCubeTo(e.target, JSON.parse(e.target.dataset.faces), 64);
  });
});

function cell(name, d, removable, idx) {
  var c = document.createElement("div");
  c.className = "cell"; c.title = name; c.draggable = true;
  var node;
  if (d.t === "cube" && iso.checked) {
    node = document.createElement("canvas");
    node.width = 64; node.height = 64;
    node.dataset.faces = JSON.stringify(d.f);
    obs.observe(node);
  } else {
    node = document.createElement("img");
    node.src = d.t === "cube" ? texUrl("block", d.f[1]) : d.src;
    node.loading = "lazy"; node.draggable = false;
  }
  c.appendChild(node);
  c.addEventListener("dragstart", function (e) { e.dataTransfer.setData("text/plain", JSON.stringify(d)); });
  c.addEventListener("click", function () {
    var p = document.querySelector(".cell.sel");
    if (p) p.classList.remove("sel");
    if (selected && JSON.stringify(selected) === JSON.stringify(d)) selected = null;
    else { selected = d; c.classList.add("sel"); }
  });
  if (removable) {
    var x = document.createElement("span");
    x.className = "x"; x.textContent = "X";
    x.addEventListener("click", function (e) { e.stopPropagation(); customs.splice(idx, 1); renderCustom(); });
    c.appendChild(x);
  }
  return c;
}

var all = [];
ITEMS.forEach(function (n) { all.push({ name: n, d: { t: "flat", src: texUrl("item", n) } }); });
Object.keys(BLOCKS).forEach(function (n) { all.push({ name: n, d: { t: "cube", f: BLOCKS[n] } }); });
all.sort(function (a, b) { return a.name < b.name ? -1 : 1; });

var listMc = document.getElementById("listMc");
function renderMc() {
  var f = document.getElementById("search").value.toLowerCase();
  listMc.innerHTML = "";
  var frag = document.createDocumentFragment(), n = 0;
  all.forEach(function (o) {
    if (f && o.name.indexOf(f) === -1) return;
    frag.appendChild(cell(o.name, o.d, false)); n++;
  });
  listMc.appendChild(frag);
  document.getElementById("count").textContent = " " + n + " textures";
}
renderMc();

var listCustom = document.getElementById("listCustom");
function renderCustom() {
  listCustom.innerHTML = "";
  customs.forEach(function (o, i) { listCustom.appendChild(cell(o.name, { t: "flat", src: o.src }, true, i)); });
}

document.getElementById("search").addEventListener("input", renderMc);
iso.addEventListener("change", function () { renderMc(); refreshSlots(); });

document.querySelectorAll("#tabs button").forEach(function (b) {
  b.addEventListener("click", function () {
    document.querySelectorAll("#tabs button").forEach(function (o) { o.classList.remove("on"); });
    b.classList.add("on");
    var mc = b.dataset.tab === "mc";
    listMc.style.display = mc ? "grid" : "none";
    listCustom.style.display = mc ? "none" : "grid";
    document.getElementById("search").style.display = mc ? "" : "none";
    document.getElementById("count").style.display = mc ? "" : "none";
  });
});

var fileInput = document.getElementById("file");
document.getElementById("add").addEventListener("click", function () { fileInput.click(); });
fileInput.addEventListener("change", function (e) {
  Array.prototype.forEach.call(e.target.files, importFile);
  fileInput.value = "";
});
function importFile(f) {
  var r = new FileReader();
  r.onload = function () {
    var im = new Image();
    im.onload = function () {
      if (im.width !== im.height) { alert(f.name + " : image non 1:1 (" + im.width + "x" + im.height + ")"); return; }
      var cv = document.createElement("canvas");
      cv.width = 128; cv.height = 128;
      var cx = cv.getContext("2d");
      cx.imageSmoothingEnabled = false;
      cx.drawImage(im, 0, 0, 128, 128);
      customs.push({ name: f.name, src: cv.toDataURL("image/png") });
      renderCustom();
    };
    im.src = r.result;
  };
  r.readAsDataURL(f);
}

document.getElementById("dl").addEventListener("click", function () {
  var cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  var cx = cv.getContext("2d");
  cx.imageSmoothingEnabled = false;
  load(document.querySelector("#tpl img.bg").src).then(function (bg) {
    cx.drawImage(bg, 0, 0, W, H);
    return Promise.all(Object.keys(placed).map(function (i) {
      var d = placed[i], s = SLOTS[i], sz = Math.round(s[2] * 0.82), off = Math.round((s[2] - sz) / 2);
      if (d.t === "cube" && iso.checked) {
        return cubeImgs(d.f).then(function (imgs) { drawCube(cx, imgs, s[0] + off, s[1] + off, sz); });
      }
      var src = d.t === "cube" ? texUrl("block", d.f[1]) : d.src;
      return load(src).then(function (im) {
        cx.imageSmoothingEnabled = false;
        cx.drawImage(im, s[0] + off, s[1] + off, sz, sz);
      });
    }));
  }).then(function () {
    var a = document.createElement("a");
    a.download = "craft.png";
    a.href = cv.toDataURL("image/png");
    a.click();
  }).catch(function (e) { alert("Erreur export : " + e); });
});

document.getElementById("clear").addEventListener("click", function () {
  SLOTS.forEach(function (_, i) { setSlot(i, null); });
});
